version: 2.1

jobs:
  build:
    docker:
      - image: circleci/python:3.8

    working_directory: ~/repo

    steps:
      - checkout
      - run:
          name: install dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install -r tests/requirements.txt
      - run:
          name: Run NewsML-G2 unit tests using Python lxml
          # This also validates every document in examples/ against the current
          # Power schema — see test_examples_folder_validates in tests/runtests.py.
          command: |
            . venv/bin/activate
            tests/runtests.py
      - run:
          name: Check the Structure Matrix matches the schemas
          command: |
            . venv/bin/activate
            tools/xsdref/generate.py --verify-matrix --all-versions
      - run:
          name: Check the Specification §14 notes match the schema
          command: |
            . venv/bin/activate
            tools/xsdref/generate.py --check
      - run:
          # The matrix check compares generated output against committed
          # output, so it cannot catch a schema change that breaks page
          # generation itself. This exercises the whole path — parsing, group
          # inlining, cardinality, attribute closure, §14 binding — against
          # the current schema. Pure Python; the full site is built by the
          # docs job below.
          name: Check the reference pages still generate
          command: |
            . venv/bin/activate
            tools/xsdref/generate.py --pages --partials --output /tmp/reference

  docs:
    # Builds the whole documentation site (Specification, Guidelines and
    # schema reference) from docs-src/ and the schema, and keeps it as a
    # build artifact so a pull request can be reviewed as rendered pages.
    docker:
      - image: cimg/python:3.12

    working_directory: ~/repo

    steps:
      - checkout
      - run:
          name: install dependencies
          # Asciidoctor is pinned: tools/prosedoc parses its HTML output, so a
          # new version should be a deliberate change, checked by this job.
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq ruby
            sudo gem install --no-document asciidoctor:2.0.24 coderay:1.1.3
            python3 -m venv venv
            . venv/bin/activate
            pip install -r tests/requirements.txt
      - run:
          name: Build the documentation site
          # Fails on any Asciidoctor warning in the books, such as an include
          # or image that does not resolve.
          command: |
            . venv/bin/activate
            tools/docsite.py --output /tmp/site
      - store_artifacts:
          path: /tmp/site
          destination: site

workflows:
  checks:
    jobs:
      - build
      - docs
